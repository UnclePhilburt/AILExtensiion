<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IMPACT Phone</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Current Lead</h1>
        <p id="status">Waiting for lead...</p>
      </header>

      <section class="bridgeSetup" id="bridgeSetup">
        <label for="bridgeUrl">Bridge URL</label>
        <input id="bridgeUrl" placeholder="http://192.168.1.169:8787">
        <label for="bridgeToken">Token</label>
        <input id="bridgeToken" placeholder="Token from bridge server">
        <button id="saveBridge" type="button">Connect</button>
        <p>
          The hosted page is only the UI shell. Live lead data still comes from your local bridge or a future approved backend.
        </p>
      </section>

      <section id="leadCard" class="leadCard empty">
        Send a lead from the Brave extension.
      </section>

      <section id="nextLeadCard" class="leadCard empty">
        No preloaded next lead yet.
      </section>

      <section class="controls">
        <button type="button" disabled>No Answer</button>
        <button type="button" disabled>Voicemail</button>
        <button type="button" disabled>Contacted</button>
        <button type="button" disabled>Callback</button>
        <button type="button" disabled>Appointment</button>
        <button type="button" disabled>Not Interested</button>
        <button type="button" disabled>Bad Number</button>
        <button type="button" disabled>Notes</button>
        <button type="button" disabled>Next</button>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
