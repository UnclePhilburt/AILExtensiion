<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Phone number health · IMPACT Companion</title><script src="settings-boot.js"></script><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="numbers.css?v=1"><link rel="stylesheet" href="journal.css?v=1"></head>
<body class="wsPage"><main class="app calmApp numbersPage">
<div class="wsBand"><header class="wsHeader"><div class="workspaceTop calmTop"><a class="brand homeBrand" href="./" aria-label="IMPACT Companion home"><span class="brandMark" aria-hidden="true">i.</span> IMPACT <span class="brandSub">COMPANION</span></a><a class="backLink" href="./">← Home</a></div><p class="eyebrow" data-with-name="{name}'s numbers">YOUR NUMBERS</p><h1>Phone number health</h1><p class="numbersLead">An estimate from the last 30 days of calls you logged. Not a carrier spam label.</p><p class="encLine" data-encourage="settings" aria-live="off"></p></header></div>
<div class="wsBody">
<section id="callingNumbers">
<form id="callingNumberForm" class="calmCard addNumber">
<p class="eyebrow">ADD</p>
<h2>A calling number</h2>
<label for="callingNumberPhone">Phone<input id="callingNumberPhone" name="phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="24" placeholder="(555) 123-4567" required disabled></label>
<label for="callingNumberLabel">Name, if you want<input id="callingNumberLabel" name="label" type="text" maxlength="40" placeholder="Work phone" disabled></label>
<button type="submit" disabled>Save number</button>
</form>
<p id="callingNumberStatus" class="numberStatus" role="status" aria-live="polite">Loading calling numbers…</p>
<div id="callingNumberList" class="callingNumberList"></div>
<button id="refreshCallingNumbers" class="refreshNumbers" type="button">Refresh</button>
</section>
</div>
</main><script type="module" src="work-hours-guard.js?v=2"></script><script type="module" src="calling-numbers.js?v=4"></script><script type="module" src="encouragement-ui.js?v=2"></script></body></html>
